<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>水平合并:colspan。保留左面的,舍去右面的</p>
    <p>竖直合并:rowspan。保留上面的,舍去下面的</p>
    
    <table border="1" width="600px" height="400px">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td colspan="2">6</td>
            <td>8</td>
            <td>9</td>
            <td>0</td>
        </tr>
        <tr>
            <td>11</td>
            <td>12</td>
            <td rowspan="3">13</td>
            <td>14</td>
            <td rowspan="2">15</td>
        </tr>
        <tr>
            <td colspan="2" rowspan="2">16</td>
            <td>19</td>
        </tr>
        <tr>
            <td>24</td>
            <td>25</td>
        </tr>
    </table>




</body>
</html>
