<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>块元素是上下摆放，比如标题、段落、列表等</p>
    <p>行内元素是左右摆放，比如超链接、标签等，无法识别宽高</p>
    <p>比较特殊的一类是行内块级元素，比如照片、按钮，虽然也是横着左右摆放，但是可以修改大小</p>
    
</body>
</html>
