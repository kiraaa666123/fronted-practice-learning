<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        p,h3{
            color: chartreuse;
            font-size: 30px;
        }

        .text,.text1{
            color: blue;
            font-size: 20px;
        }

    </style>
</head>
<body>
    
    <p>我是p标签</p>
    <h3>我是h3标签</h3>

    <p class="text">我是p类</p>
    <h3 class="text1">我是text1类</h3>
</body>
</html>
